<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Dashboard | Attendify</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">

            <a class="navbar-brand fw-bold" href="index.html">
                ATTENDIFY
            </a>

            <button
                class="btn btn-outline-light"
                onclick="logout()">
                Logout
            </button>

        </div>
    </nav>


    <!-- Dashboard -->
    <div class="container py-5">

        <div class="mb-4">
            <h2 class="fw-bold">
                Welcome, <span id="studentName">Student</span> 👋
            </h2>

            <p class="text-muted">
                Here's your attendance overview.
            </p>
        </div>


        <!-- Summary Cards -->
        <div class="row g-4 mb-5">

            <div class="col-md-4">

                <div class="card shadow-sm border-0 text-center p-3">

                    <h6 class="text-muted">
                        Overall Attendance
                    </h6>

                    <h2 id="overallPercentage" class="fw-bold">
                        0%
                    </h2>

                </div>

            </div>


            <div class="col-md-4">

                <div class="card shadow-sm border-0 text-center p-3">

                    <h6 class="text-muted">
                        Present Classes
                    </h6>

                    <h2 id="presentClasses" class="fw-bold">
                        0
                    </h2>

                </div>

            </div>


            <div class="col-md-4">

                <div class="card shadow-sm border-0 text-center p-3">

                    <h6 class="text-muted">
                        Total Classes
                    </h6>

                    <h2 id="totalClasses" class="fw-bold">
                        0
                    </h2>

                </div>

            </div>

        </div>


        <!-- Subject Attendance -->
        <div class="card shadow-sm border-0 mb-4">

            <div class="card-body">

                <h4 class="fw-bold mb-4">
                    Subject-wise Attendance
                </h4>

                <div class="table-responsive">

                    <table class="table table-hover">

                        <thead class="table-dark">

                            <tr>
                                <th>Subject</th>
                                <th>Code</th>
                                <th>Present</th>
                                <th>Total</th>
                                <th>Percentage</th>
                            </tr>

                        </thead>

                        <tbody id="subjectTable">

                            <tr>
                                <td colspan="5"
                                    class="text-center">
                                    Loading attendance...
                                </td>
                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>


        <!-- Attendance History -->
        <div class="card shadow-sm border-0">

            <div class="card-body">

                <h4 class="fw-bold mb-4">
                    Attendance History
                </h4>

                <div class="table-responsive">

                    <table class="table table-hover">

                        <thead class="table-dark">

                            <tr>
                                <th>Date</th>
                                <th>Subject</th>
                                <th>Status</th>
                            </tr>

                        </thead>

                        <tbody id="historyTable">

                            <tr>
                                <td colspan="3"
                                    class="text-center">
                                    Loading...
                                </td>
                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>


    <script src="js/student.js"></script>

</body>

</html>
