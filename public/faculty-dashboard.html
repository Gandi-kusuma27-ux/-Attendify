<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Faculty Dashboard | Attendify</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">

            <a class="navbar-brand fw-bold" href="index.html">
                ATTENDIFY
            </a>

            <button
                class="btn btn-outline-light"
                onclick="logout()">
                Logout
            </button>

        </div>
    </nav>


    <div class="container py-5">

        <!-- Welcome -->
        <div class="mb-4">

            <h2 class="fw-bold">
                Faculty Dashboard 👨‍🏫
            </h2>

            <p class="text-muted">
                Mark and manage student attendance.
            </p>

        </div>


        <!-- Mark Attendance Card -->
        <div class="card shadow border-0 mb-4">

            <div class="card-body p-4">

                <h4 class="fw-bold mb-4">
                    Mark Attendance
                </h4>


                <div id="message"></div>


                <form id="attendanceForm">

                    <div class="row g-3">


                        <!-- Student -->
                        <div class="col-md-6">

                            <label class="form-label">
                                Select Student
                            </label>

                            <select
                                id="student"
                                class="form-select"
                                required>

                                <option value="">
                                    Loading students...
                                </option>

                            </select>

                        </div>


                        <!-- Subject -->
                        <div class="col-md-6">

                            <label class="form-label">
                                Select Subject
                            </label>

                            <select
                                id="subject"
                                class="form-select"
                                required>

                                <option value="">
                                    Loading subjects...
                                </option>

                            </select>

                        </div>


                        <!-- Date -->
                        <div class="col-md-6">

                            <label class="form-label">
                                Attendance Date
                            </label>

                            <input
                                type="date"
                                id="attendanceDate"
                                class="form-control"
                                required>

                        </div>


                        <!-- Status -->
                        <div class="col-md-6">

                            <label class="form-label">
                                Attendance Status
                            </label>

                            <select
                                id="status"
                                class="form-select"
                                required>

                                <option value="">
                                    Select Status
                                </option>

                                <option value="Present">
                                    Present
                                </option>

                                <option value="Absent">
                                    Absent
                                </option>

                            </select>

                        </div>


                    </div>


                    <button
                        type="submit"
                        class="btn btn-primary mt-4">

                        Save Attendance

                    </button>

                </form>

            </div>

        </div>


        <!-- Attendance Records -->
        <div class="card shadow border-0">

            <div class="card-body p-4">

                <h4 class="fw-bold mb-4">
                    Attendance Records
                </h4>

                <div class="table-responsive">

                    <table class="table table-hover">

                        <thead class="table-dark">

                            <tr>

                                <th>Student</th>
                                <th>Subject</th>
                                <th>Date</th>
                                <th>Status</th>

                            </tr>

                        </thead>

                        <tbody id="attendanceTable">

                            <tr>

                                <td
                                    colspan="4"
                                    class="text-center">

                                    Loading records...

                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>


    <script src="js/faculty.js"></script>

</body>

</html>
